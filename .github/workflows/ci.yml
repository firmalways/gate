name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and end-to-end tests (standard library only)
        run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build and install the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist .
          python -m pip install --quiet dist/*.whl
          firmalways-gate scan "นายสมชาย ใจดี โทร 0812345678"
      - name: Benchmark
        run: firmalways-gate benchmark

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser extension logic tests
        run: node --test extension/test/
